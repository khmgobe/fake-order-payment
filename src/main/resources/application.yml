spring:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    springdoc:
      swagger-ui:
        path: /swagger-ui.html

  datasource:
    url: jdbc:mariadb://localhost:3307/backend
    username: root
    password: root

logging:
  level:
    org.hibernate.sql: DEBUG
    org.hibernate.type.descriptor.sql: TRACE